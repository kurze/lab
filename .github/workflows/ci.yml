name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  agentcore:
    name: agentcore
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentcore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build ./...
      - run: go vet ./...

  fast-chat-go:
    name: fast-chat (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fast-chat/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: fast-chat/go/go.sum
      - run: go build ./...
      - run: go test ./...
      - run: go vet ./...

  fast-chat-rust:
    name: fast-chat (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fast-chat/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fast-chat/rust
      - run: cargo build
      - run: cargo clippy -- -D warnings

  review-agent:
    name: review-agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: review-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: review-agent/go.sum
      - run: go build ./...
      - run: go test ./...
      - run: go vet ./...

  gitlab-reviewer:
    name: gitlab-reviewer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gitlab-reviewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: gitlab-reviewer/go.sum
      - run: go build ./...
      - run: go vet ./...

  rfc863:
    name: rfc863
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rfc863
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rfc863
      - run: cargo build
      - run: cargo clippy -- -D warnings
