# scrutineer configuration
#
# Place this file at ~/.config/scrutineer/config.toml

# Forge type: "gitlab" or "github" (auto-detected from git remote if omitted)
# forge = "gitlab"

# Forge base URL (default: https://gitlab.com or https://github.com)
# forge_url = "https://gitlab.example.com"

# API token (or set FORGE_TOKEN env var)
# token = ""

# Project path as owner/repo (or set FORGE_PROJECT env var)
# project = "owner/repo"

# Path to local repo clone (default: current directory)
# repo_path = "."

# Review mode: "full", "commits", or "both" (default: "full")
# review_mode = "full"

# Comment style: "summary", "inline", or "both" (default: "both")
#   summary = single MR comment with all findings
#   inline  = inline comments on diff lines only
#   both    = inline comments + summary comment
# comment_style = "both"

# Minimum severity for inline comments: "info", "minor", "major", "critical" (default: "minor")
# inline_severity = "minor"

# Review agent: builtin (default), claude, codex, gemini, vibe, opencode, pi, custom
# [agent]
# name = "builtin"
# command = ""         # only for name="custom"

# External review command (receives diff on stdin, outputs JSON)
# Equivalent to [agent] name="custom", command="..."
# review_command = "my-reviewer"
# review_agent = "my-reviewer/v1"

# LLM provider for the builtin agent
# Provider presets: lmstudio, ollama, mistral, openai, openrouter
# [llm]
# provider = "lmstudio"
# url = "http://localhost:1234/v1/chat/completions"
# model = "model-name"
# api_key = ""                    # or set REVIEW_LLM_API_KEY env var
# context_size = 200000
# token_ceiling = 150000
# temperature = 0.3

# Trace log directory (default: ~/.local/state/scrutineer/traces/)
# log_dir = "/path/to/traces"          # or set SCRUTINEER_LOG_DIR env var

# Trace log rotation
# log_max_age_days = 30                # delete traces older than N days
# log_max_size_mb = 500                # cap total trace directory size

# --- Examples ---

# Use Claude Code as the review agent:
# [agent]
# name = "claude"

# Use the builtin agent with OpenRouter:
# [agent]
# name = "builtin"
# [llm]
# provider = "openrouter"
# api_key = "sk-or-..."
# model = "anthropic/claude-sonnet-4"

# Use a local LM Studio instance (default):
# [llm]
# provider = "lmstudio"
# model = "qwen3.6-35b-a3b@q4_k_s"
